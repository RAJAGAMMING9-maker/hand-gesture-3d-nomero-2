<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hand Gesture Particle 3D</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#02040b;color:#fff;font-family:system-ui,Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;z-index:3;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;padding:16px 12px;text-shadow:0 2px 12px #000;pointer-events:none}
h1{font-size:clamp(19px,5vw,28px);letter-spacing:.1em;margin:0}#status{font-size:13px;color:#b9c9ee;margin-top:7px}
#start{position:fixed;z-index:5;left:50%;top:53%;transform:translate(-50%,-50%);border:1px solid #75dfff88;border-radius:999px;padding:15px 23px;font-size:15px;font-weight:800;color:#eaffff;background:#073044;box-shadow:0 0 35px #00d9ff44}
#cam{position:fixed;z-index:2;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(28vw,140px);border:1px solid #b9eaff66;border-radius:12px;transform:scaleX(-1);opacity:.82;background:#111}
#hint{position:fixed;z-index:3;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:66vw;padding:10px 12px;border:1px solid #c4e8ff22;border-radius:12px;background:#07101bd9;color:#e5f7ff;font-size:12px;line-height:1.5;backdrop-filter:blur(8px)}
#label{font-weight:800;font-size:15px;color:#fff}.hidden{display:none}
</style></head>
<body>
<canvas id="scene"></canvas>
<header><h1>PARTICLE GESTURE 3D</h1><div id="status">Tekan aktifkan kamera untuk memulai</div></header>
<button id="start">📷 AKTIFKAN KAMERA</button>
<video id="cam" autoplay playsinline muted class="hidden"></video>
<div id="hint"><div id="label">PARTICLES STANDBY</div>☝️ Telunjuk: Saturnus<br>✌️ Dua jari: I LOVE YOU<br>✊ Mengepal: hati 3D</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
(()=> {
const $=s=>document.querySelector(s), canvas=$('#scene'), video=$('#cam'), btn=$('#start'), status=$('#status'), label=$('#label');
if(!window.THREE||!window.Hands){status.textContent='Library gagal dimuat. Periksa internet dan muat ulang halaman.';btn.textContent='MUAT ULANG';btn.onclick=()=>location.reload();return}
const THREE_=THREE;
const renderer=new THREE_.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x02040b,1);
const scene=new THREE_.Scene();scene.fog=new THREE_.FogExp2(0x02040b,.018);
const camera=new THREE_.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,0,10);
scene.add(new THREE_.AmbientLight(0xffffff,1.4));
const pointLight=new THREE_.PointLight(0x4ddcff,45);pointLight.position.set(3,4,5);scene.add(pointLight);
const pointLight2=new THREE_.PointLight(0xff174f,25);pointLight2.position.set(-4,-2,2);scene.add(pointLight2);

// Background star dust
const dustCount=650, dustPositions=new Float32Array(dustCount*3);
for(let i=0;i<dustCount;i++){dustPositions[i*3]=(Math.random()-.5)*28;dustPositions[i*3+1]=(Math.random()-.5)*18;dustPositions[i*3+2]=-Math.random()*24-2}
const dustGeo=new THREE_.BufferGeometry();dustGeo.setAttribute('position',new THREE_.BufferAttribute(dustPositions,3));
const dust=new THREE_.Points(dustGeo,new THREE_.PointsMaterial({color:0x6688bb,size:.025,transparent:true,opacity:.55}));scene.add(dust);

// Build target point clouds
const N=8500;
function cloudFromSurface(sampler,n=N){const out=new Float32Array(n*3);for(let i=0;i<n;i++){const p=sampler(i,n);out[i*3]=p[0];out[i*3+1]=p[1];out[i*3+2]=p[2]}return out}
function sphereCloud(radius, flatten=1){
 return cloudFromSurface(()=>{const u=Math.random()*2-1, a=Math.random()*Math.PI*2, r=Math.sqrt(1-u*u)*radius;return [Math.cos(a)*r, u*radius*flatten, Math.sin(a)*r]});
}
function saturnCloud(){
 return cloudFromSurface((i,n)=>{
  const type=i%10;
  if(type<7){const u=Math.random()*2-1,a=Math.random()*Math.PI*2,r=Math.sqrt(1-u*u);return [Math.cos(a)*r*1.05,u*1.05,Math.sin(a)*r*1.05]}
  const a=Math.random()*Math.PI*2, r=1.32+Math.random()*.82;
  return [Math.cos(a)*r,Math.sin(a)*r*.30,Math.sin(a)*r*.74];
 });
}
function heartCloud(){
 return cloudFromSurface(()=>{
  // Random points inside a classic heart cross-section, with volume thickness.
  let x,y;
  do{x=Math.random()*2.5-1.25;y=Math.random()*2.3-1.05}
  while((x*x+y*y-1)**3-x*x*y*y*y>0);
  return [x*1.3,y*1.3,(Math.random()-.5)*.58];
 });
}
function textCloud(text){
 const c=document.createElement('canvas');c.width=1000;c.height=300;const ctx=c.getContext('2d');
 ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.font='900 120px Arial';ctx.fillText(text,500,150,960);
 const data=ctx.getImageData(0,0,c.width,c.height).data, pixels=[];
 for(let y=0;y<c.height;y+=3)for(let x=0;x<c.width;x+=3){if(data[(y*c.width+x)*4+3]>100)pixels.push([x,y])}
 const out=new Float32Array(N*3);
 for(let i=0;i<N;i++){const p=pixels[Math.floor(Math.random()*pixels.length)]||[500,150];out[i*3]=(p[0]-500)/180;out[i*3+1]=(150-p[1])/180;out[i*3+2]=(Math.random()-.5)*.16}
 return out;
}
const targets={
 saturn:saturnCloud(),
 love:textCloud('I LOVE YOU ♥'),
 heart:heartCloud()
};
const colors={
 saturn:new THREE_.Color(0xffd49a),
 love:new THREE_.Color(0x45ffe0),
 heart:new THREE_.Color(0xff174f)
};
const positions=new Float32Array(N*3), colorsArr=new Float32Array(N*3), sizes=new Float32Array(N);
for(let i=0;i<N;i++){
 positions[i*3]=(Math.random()-.5)*9;positions[i*3+1]=(Math.random()-.5)*7;positions[i*3+2]=(Math.random()-.5)*4;
 sizes[i]=.025+Math.random()*.035;
 colorsArr[i*3]=.35;colorsArr[i*3+1]=.65;colorsArr[i*3+2]=1;
}
const geometry=new THREE_.BufferGeometry();geometry.setAttribute('position',new THREE_.BufferAttribute(positions,3).setUsage(THREE_.DynamicDrawUsage));geometry.setAttribute('color',new THREE_.BufferAttribute(colorsArr,3));
const material=new THREE_.PointsMaterial({size:.045,vertexColors:true,transparent:true,opacity:.98,depthWrite:false,blending:THREE_.AdditiveBlending,sizeAttenuation:true});
const particles=new THREE_.Points(geometry,material);scene.add(particles);
let mode='idle', targetMode='idle', transition=1, modeAge=0;
function setMode(m){
 if(m===targetMode)return;
 targetMode=m;transition=0;modeAge=0;
 const title=m==='saturn'?'🪐 SATURNUS • PARTICLE 3D':m==='love'?'💚 I LOVE YOU • PARTICLES':m==='heart'?'❤️ HEART • PARTICLE 3D':'PARTICLES MENYEBAR';
 label.textContent=title;
}
function targetFor(m,i){
 if(m==='idle')return [(Math.random()-.5)*9,(Math.random()-.5)*7,(Math.random()-.5)*4];
 const arr=targets[m];return [arr[i*3],arr[i*3+1],arr[i*3+2]];
}
let fromPositions=positions.slice();
function beginTransition(m){
 fromPositions=positions.slice();setMode(m);
}
const originalSetMode=setMode;
setMode=function(m){if(m===targetMode)return;fromPositions=positions.slice();originalSetMode(m)};
function fingerRaised(lm,tip,pip){const wrist=lm[0],t=lm[tip],p=lm[pip];return Math.hypot(t.x-wrist.x,t.y-wrist.y)>Math.hypot(p.x-wrist.x,p.y-wrist.y)*1.10}
function detect(lm){
 const a=fingerRaised(lm,8,6),b=fingerRaised(lm,12,10),c=fingerRaised(lm,16,14),d=fingerRaised(lm,20,18);
 if(a&&!b&&!c&&!d)return'saturn';
 if(a&&b&&!c&&!d)return'love';
 if(!a&&!b&&!c&&!d)return'heart';
 return'idle';
}
let lastDetected='',stable=0,processing=false;
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.68,minTrackingConfidence:.62});
hands.onResults(r=>{
 processing=false;const lm=r.multiHandLandmarks&&r.multiHandLandmarks[0];
 if(!lm){status.textContent='Tunjukkan tangan ke kamera';return}
 const m=detect(lm);if(m===lastDetected)stable++;else{lastDetected=m;stable=0}
 if(stable>=3&&m!==targetMode)setMode(m);
 status.textContent='KAMERA AKTIF • gestur: '+m;
});
async function frameLoop(){
 if(video.readyState>=2&&!processing){processing=true;try{await hands.send({image:video})}catch(e){processing=false}}
 requestAnimationFrame(frameLoop);
}
btn.addEventListener('click',async()=>{
 btn.disabled=true;status.textContent='Meminta izin kamera…';
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Buka situs melalui HTTPS di browser modern.');
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
  video.srcObject=stream;await video.play();video.classList.remove('hidden');btn.classList.add('hidden');
  status.textContent='Kamera aktif • tunjukkan gestur tangan';frameLoop();
 }catch(e){btn.disabled=false;status.textContent=e.name==='NotAllowedError'?'Izin kamera ditolak. Izinkan kamera di pengaturan situs lalu muat ulang.':'Kamera gagal: '+(e.message||e.name)}
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7))});
const clock=new THREE_.Clock();
function animate(){
 requestAnimationFrame(animate);const t=clock.getElapsedTime();
 if(transition<1)transition=Math.min(1,transition+.025);
 const ease=transition*transition*(3-2*transition);
 const pos=geometry.attributes.position.array, col=geometry.attributes.color.array;
 const target=targets[targetMode], active=targetMode!=='idle';
 for(let i=0;i<N;i++){
  const j=i*3;
  let tx,ty,tz;
  if(active){tx=target[j];ty=target[j+1];tz=target[j+2]}
  else {tx=Math.sin(i*12.9898+t*.25)*4.4;ty=Math.cos(i*7.233+t*.3)*3.2;tz=Math.sin(i*3.17+t*.18)*1.8}
  const scatter=active?0:Math.sin(t*1.8+i*.13)*.18;
  pos[j]=fromPositions[j]+(tx-fromPositions[j])*ease+(active?Math.sin(t*2+i*.1)*.012:scatter);
  pos[j+1]=fromPositions[j+1]+(ty-fromPositions[j+1])*ease+(active?Math.cos(t*2+i*.09)*.012:scatter);
  pos[j+2]=fromPositions[j+2]+(tz-fromPositions[j+2])*ease;
  const c=colors[targetMode]||new THREE_.Color(0x7aaaff);
  const pulse=.78+.22*Math.sin(t*3+i*.035);
  col[j]=c.r*pulse;col[j+1]=c.g*pulse;col[j+2]=c.b*pulse;
 }
 geometry.attributes.position.needsUpdate=true;geometry.attributes.color.needsUpdate=true;
 particles.rotation.y=active?Math.sin(t*.35)*.12:t*.035;
 particles.rotation.x=active?Math.sin(t*.3)*.05:0;
 dust.rotation.y=t*.008;
 renderer.render(scene,camera);
}
animate();
})();
</script></body></html>
